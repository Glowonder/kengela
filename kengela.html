<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kengela — Observer. Localiser. Documenter.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F231D;
    --surface:#153229;
    --surface-2:#1B3D32;
    --paper:#EFE9D8;
    --paper-dim:#E3DCC6;
    --ink:#0F1B16;
    --ink-soft:#3E4C45;
    --clay:#C9793A;
    --clay-dark:#A85F28;
    --river:#3E8FA6;
    --line:rgba(239,233,216,0.14);
    --g-faible:#4C9A6B;
    --g-moderee:#D9932E;
    --g-elevee:#C9502F;
    --g-critique:#8A2A4A;
    --radius:14px;
    --shadow:0 12px 30px rgba(0,0,0,0.35);
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--paper);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
  }
  #app{
    width:100%;max-width:480px;min-height:100vh;
    background:var(--bg);position:relative;
    display:flex;flex-direction:column;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .display{font-family:'Archivo Black',sans-serif;letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- top bar ---- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 14px;
    background:linear-gradient(180deg,var(--surface),var(--bg));
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--clay);display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;color:var(--ink);font-size:15px;
    transform:rotate(-6deg);
  }
  .brand .txt .name{font-size:18px;line-height:1;}
  .brand .txt .tag{font-size:10px;color:#B9CFC5;letter-spacing:0.08em;text-transform:uppercase;margin-top:3px;}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 9px;border-radius:20px;
    border:1px solid var(--line);color:#B9CFC5;display:flex;align-items:center;gap:6px;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--g-faible);}
  .status-pill.off .dot{background:var(--clay);}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .iconbtn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--paper);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .iconbtn:active{transform:scale(0.9);background:rgba(239,233,216,0.08);}
  .notif-dot{
    position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
    background:var(--clay);border:2px solid var(--surface);
  }

  /* ---- main scroll area ---- */
  main{flex:1;overflow-y:auto;position:relative;padding-bottom:86px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- carte view ---- */
  #map{width:100%;height:46vh;min-height:280px;background:#0c1a15;}
  .map-toolbar{
    display:flex;gap:8px;padding:12px 14px;overflow-x:auto;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .chip{
    flex:0 0 auto;font-size:12px;padding:7px 12px;border-radius:20px;
    border:1px solid var(--line);color:var(--paper);background:transparent;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .chip.active{background:var(--clay);border-color:var(--clay);color:var(--ink);font-weight:600;}

  .section-title{
    font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:0.03em;
    text-transform:uppercase;color:#B9CFC5;padding:18px 18px 8px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .stamp{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.06em;
    border:1.5px dashed var(--clay);color:var(--clay);padding:3px 8px;border-radius:6px;
    transform:rotate(-1.5deg);text-transform:uppercase;
  }

  .searchbar{
    display:flex;align-items:center;gap:8px;margin:12px 14px 4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;
  }
  .searchbar input{
    flex:1;background:none;border:none;outline:none;color:var(--paper);font-size:13px;font-family:'Inter';
  }
  .searchbar input::placeholder{color:#6E8A7E;}
  .searchbar .ic{font-size:14px;color:#8FA69B;}
  .searchbar .clearx{cursor:pointer;color:#8FA69B;font-size:13px;padding:2px 4px;display:none;}
  .searchbar.has-text .clearx{display:block;}

  .feed{padding:0 14px 4px;display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;display:flex;gap:12px;cursor:pointer;transition:transform .12s ease;
    position:relative;
  }
  .card:active{transform:scale(0.985);}
  .card .thumb{
    width:64px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--surface-2);
  }
  .card .body{flex:1;min-width:0;}
  .card .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .card .cat{font-size:13px;font-weight:700;color:var(--paper);display:flex;align-items:center;gap:6px;}
  .card .grav{font-size:15px;}
  .card .meta{font-size:11px;color:#93A79D;margin-top:3px;font-family:'IBM Plex Mono',monospace;}
  .card .comment{font-size:12px;color:#CFE0D6;margin-top:6px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .photocount{font-size:10px;color:#8FA69B;margin-top:4px;}
  .badge{
    font-size:9px;padding:3px 7px;border-radius:20px;font-weight:700;letter-spacing:0.03em;
    text-transform:uppercase;display:inline-block;
  }
  .badge.st-Signalé{background:#4A3A22;color:#F0C878;}
  .badge.st-En-vérification{background:#3A3320;color:#E0B84E;}
  .badge.st-Confirmé{background:#22394A;color:#7FC4F0;}
  .badge.st-Pris-en-charge{background:#3A2244;color:#D79AF0;}
  .badge.st-Résolu{background:#204A2E;color:#7FE0A0;}
  .type-tag{
    font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700;letter-spacing:0.02em;
    text-transform:uppercase;display:inline-flex;align-items:center;gap:3px;
  }
  .type-tag.danger{background:rgba(201,80,47,0.18);color:#F0A388;}
  .type-tag.travail{background:rgba(62,143,166,0.18);color:#8FD4EA;}

  .locate-pin{
    position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
    background:rgba(15,27,22,0.55);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;
    z-index:2;
  }
  .locate-pin:active{transform:scale(0.88);}

  /* ---- FAB & bottom nav ---- */
  nav.bottomnav{
    position:absolute;bottom:0;left:0;right:0;height:74px;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;
    z-index:30;
  }
  .navbtn{
    background:none;border:none;color:#8FA69B;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:10px;font-family:'Inter';cursor:pointer;
    padding:6px 10px;letter-spacing:0.02em;
  }
  .navbtn.active{color:var(--paper);}
  .navbtn .ic{font-size:19px;}
  .fab{
    width:58px;height:58px;border-radius:50%;background:var(--clay);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 8px 20px rgba(201,121,58,0.5);border:4px solid var(--bg);
    margin-top:-30px;color:var(--ink);cursor:pointer;
  }
  .fab-label{display:none;}

  /* ---- generic panel / modal ---- */
  .sheet-overlay{
    position:absolute;inset:0;background:rgba(6,14,11,0.72);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.active{display:flex;}
  .sheet{
    background:var(--paper);color:var(--ink);width:100%;max-height:92vh;
    border-radius:20px 20px 0 0;overflow-y:auto;
    display:flex;flex-direction:column;
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet-head{
    position:sticky;top:0;background:var(--paper);z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 10px;border-bottom:1px solid rgba(15,27,22,0.1);
  }
  .sheet-head h2{margin:0;font-family:'Archivo Black';font-size:16px;flex:1;text-align:center;}
  .closebtn, .backbtn{
    width:32px;height:32px;border-radius:50%;border:none;background:rgba(15,27,22,0.08);
    font-size:16px;cursor:pointer;color:var(--ink);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease, background .15s ease;
  }
  .closebtn:active, .backbtn:active{transform:scale(0.88);background:rgba(15,27,22,0.16);}
  .backbtn{font-size:18px;}
  .drag-handle{
    width:38px;height:4px;border-radius:3px;background:rgba(15,27,22,0.18);
    margin:9px auto 0;flex:0 0 auto;
  }
  .sheet-body{padding:16px 18px 28px;}

  /* progress dots */
  .progress{display:flex;gap:5px;padding:0 18px 10px;}
  .progress span{flex:1;height:4px;border-radius:3px;background:rgba(15,27,22,0.12);}
  .progress span.done{background:var(--clay);}

  .step-title{font-family:'Archivo Black';font-size:19px;margin:4px 0 4px;}
  .step-sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px;line-height:1.4;}

  .bigbtn{
    display:block;width:100%;padding:15px;border-radius:12px;border:none;
    background:var(--clay);color:#1a1005;font-weight:800;font-size:14px;
    cursor:pointer;text-align:center;
  }
  .bigbtn:disabled{opacity:0.4;cursor:not-allowed;}
  .ghostbtn{
    display:block;width:100%;padding:13px;border-radius:12px;
    border:1.5px solid rgba(15,27,22,0.18);background:transparent;color:var(--ink);
    font-weight:600;font-size:13px;cursor:pointer;text-align:center;margin-top:8px;
  }
  .linkbtn{
    background:none;border:none;color:var(--river);font-weight:700;font-size:13px;
    cursor:pointer;padding:8px 0;text-decoration:underline;
  }

  .gpsbox{
    display:flex;align-items:center;gap:10px;background:rgba(62,143,166,0.12);
    border:1px solid rgba(62,143,166,0.35);border-radius:12px;padding:12px;margin-bottom:16px;
  }
  .gpsbox .ic{font-size:20px;}
  .gpsbox .lat{font-family:'IBM Plex Mono';font-size:12px;color:#1F5B73;}
  .gpsbox .lbl{font-size:11px;color:var(--ink-soft);}

  /* ================= ZONE D'AJOUT PHOTOS (création uniquement) ================= */
  .photo-add-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;
  }
  .photo-add-slot{
    position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:rgba(15,27,22,0.05);
  }
  .photo-add-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-add-slot .rm{
    position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
    background:rgba(15,27,22,0.75);color:#fff;border:none;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .photo-counter{
    text-align:center;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;
  }
  .photo-add-buttons{display:flex;gap:10px;margin-bottom:14px;}
  .photo-add-buttons label{
    flex:1;text-align:center;padding:13px;border-radius:12px;
    border:1.5px solid rgba(15,27,22,0.18);background:transparent;color:var(--ink);
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .photo-add-buttons label.disabled{opacity:0.35;pointer-events:none;}
  .photo-add-empty{
    border:2px dashed rgba(15,27,22,0.25);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px 10px;text-align:center;gap:6px;min-height:120px;margin-bottom:4px;
  }
  .photo-add-empty .icon{font-size:26px;}
  .photo-add-empty .hint{font-size:12px;color:var(--ink-soft);}

  /* ================= GALERIE DE CONSULTATION (fiche uniquement, lecture seule) ================= */
  .photo-view-gallery{margin-bottom:16px;}
  .photo-view-main{
    width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--surface-2);margin-bottom:8px;
  }
  .photo-view-main img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .photo-view-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .photo-view-thumbs .t{
    aspect-ratio:1/1;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--surface-2);
  }
  .photo-view-thumbs .t.sel{border-color:var(--clay);}
  .photo-view-thumbs .t img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-view-empty{
    width:100%;height:160px;border-radius:14px;background:rgba(15,27,22,0.05);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;margin-bottom:16px;
  }

  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
  .catgroup{margin-bottom:14px;}
  .catgroup h4{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:0 0 8px;}
  .catbtn{
    padding:11px 10px;border-radius:10px;border:1.5px solid rgba(15,27,22,0.14);
    background:#fff;font-size:12.5px;text-align:left;cursor:pointer;color:var(--ink);
  }
  .catbtn.sel{border-color:var(--clay);background:rgba(201,121,58,0.12);font-weight:700;}

  textarea.commentbox{
    width:100%;border-radius:12px;border:1.5px solid rgba(15,27,22,0.16);
    padding:12px;font-size:13.5px;font-family:'Inter';resize:vertical;min-height:90px;
  }
  input.textinput{
    width:100%;border-radius:10px;border:1.5px solid rgba(15,27,22,0.16);
    padding:11px 12px;font-size:13px;font-family:'Inter';
  }

  .gravrow{display:flex;flex-direction:column;gap:8px;}
  .gravopt{
    display:flex;align-items:flex-start;gap:10px;border:1.5px solid rgba(15,27,22,0.14);
    border-radius:12px;padding:12px;cursor:pointer;background:#fff;
  }
  .gravopt.sel{border-color:var(--clay);background:rgba(201,121,58,0.1);}
  .gravopt .e{font-size:19px;}
  .gravopt .t{font-weight:700;font-size:13px;}
  .gravopt .d{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .reviewrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(15,27,22,0.08);font-size:13px;gap:12px;}
  .reviewrow b{font-weight:700;text-align:right;}

  /* ---- projets (choix dans le flux) ---- */
  .projpick{
    border:1.5px solid rgba(15,27,22,0.14);border-radius:12px;padding:12px;margin-bottom:8px;
    cursor:pointer;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .projpick.sel{border-color:var(--clay);background:rgba(201,121,58,0.1);}
  .projpick .n{font-weight:700;font-size:13px;}
  .projpick .c{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* ---- liens / sources ---- */
  .links-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .link-row{
    display:flex;align-items:center;gap:10px;border:1.5px solid rgba(15,27,22,0.14);
    border-radius:12px;padding:11px 12px;background:#fff;
  }
  .link-row .ic{font-size:16px;}
  .link-row .info{flex:1;min-width:0;}
  .link-row .lt{font-weight:700;font-size:12.5px;}
  .link-row .lu{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .link-row .actions{display:flex;gap:6px;flex:0 0 auto;}
  .link-row .actions button{
    width:26px;height:26px;border-radius:50%;border:none;background:rgba(15,27,22,0.08);
    cursor:pointer;font-size:12px;color:var(--ink);
  }
  .link-form{
    border:1.5px dashed rgba(15,27,22,0.25);border-radius:12px;padding:14px;margin-bottom:10px;
  }
  .link-form label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;display:block;margin:8px 0 4px;}
  .link-form label:first-child{margin-top:0;}
  .link-form .rowbtns{display:flex;gap:8px;margin-top:12px;}
  .link-form .rowbtns button{flex:1;}

  .view-links{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .view-link-row{
    display:flex;align-items:center;gap:10px;background:rgba(15,27,22,0.04);border-radius:12px;padding:12px;
    text-decoration:none;color:var(--ink);
  }
  .view-link-row .ic{font-size:17px;flex:0 0 auto;}
  .view-link-row .info{flex:1;min-width:0;}
  .view-link-row .lt{font-weight:700;font-size:13px;}
  .view-link-row .lu{font-size:11px;color:var(--river);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .view-link-row .go{font-size:14px;color:var(--ink-soft);flex:0 0 auto;}

  /* fiche */
  .fiche-id{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}
  .fiche-title{font-family:'Archivo Black';font-size:18px;margin:4px 0 8px;}
  .fiche-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .fiche-comment{font-size:13.5px;line-height:1.5;background:rgba(15,27,22,0.04);padding:12px;border-radius:12px;margin-bottom:16px;}
  .confidence{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;}
  .confidence .lv{background:#22394A;color:#7FC4F0;padding:3px 8px;border-radius:20px;font-weight:700;}

  .timeline{margin:0;padding:0 0 0 14px;border-left:2px solid rgba(15,27,22,0.14);}
  .tlitem{position:relative;padding:0 0 16px 16px;}
  .tlitem::before{content:'';position:absolute;left:-21px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--clay);}
  .tlitem .d{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink-soft);}
  .tlitem .l{font-size:12.5px;margin-top:2px;}
  .tlitem .photos-mini{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .tlitem .photos-mini img{width:52px;height:52px;border-radius:8px;object-fit:cover;}

  .confirmrow{display:flex;gap:8px;margin:14px 0 4px;}
  .confbtn{flex:1;padding:10px;border-radius:10px;border:1.5px solid rgba(15,27,22,0.16);background:#fff;font-size:12px;font-weight:700;cursor:pointer;}
  .confbtn.picked{background:var(--river);border-color:var(--river);color:#fff;}
  .confbtn.locked{opacity:0.45;pointer-events:none;}
  .confbtn.picked.locked{opacity:1;}
  .confcount{font-size:11px;color:var(--ink-soft);margin-top:8px;text-align:center;}

  .locatebtn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;
    border-radius:12px;border:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;
    cursor:pointer;margin-bottom:16px;
  }

  /* travaux list */
  .proj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 14px 12px;position:relative;}
  .proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .proj-top .name{font-weight:700;font-size:14px;}
  .proj-top .city{font-size:11px;color:#93A79D;font-family:'IBM Plex Mono';margin-top:2px;}
  .bar-track{height:7px;background:var(--surface-2);border-radius:6px;margin:10px 0 6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--clay);}
  .proj-foot{display:flex;justify-content:space-between;font-size:11px;color:#93A79D;}
  .star{cursor:pointer;font-size:16px;}

  .empty{padding:30px 20px;text-align:center;color:#8FA69B;font-size:13px;}

<script>
(function(){

/* ===================== STOCKAGE — COMPATIBILITÉ HORS CLAUDE.AI =====================
   window.storage n'existe que dans l'interface Claude.ai. Quand ce fichier est ouvert
   directement dans un navigateur, on fabrique ici un équivalent basé sur localStorage
   (ou sur la mémoire si localStorage est indisponible), pour un fonctionnement 100%
   autonome. */
if(!window.storage){
  let memoryStore = {};
  let usesLocalStorage = false;
  try{ localStorage.setItem('__kengela_test__','1'); localStorage.removeItem('__kengela_test__'); usesLocalStorage = true; }catch(e){ usesLocalStorage = false; }
  const STORE_KEY = 'kengela_local_storage_v1';
  function readStore(){
    if(!usesLocalStorage) return memoryStore;
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function writeStore(obj){
    if(!usesLocalStorage){ memoryStore = obj; return; }
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }catch(e){}
  }
  function nsKey(key, shared){ return (shared ? 'shared:' : 'user:') + key; }
  window.storage = {
    async get(key, shared){
      const store = readStore(); const k = nsKey(key, shared);
      if(!(k in store)) return null;
      return {key, value: store[k], shared: !!shared};
    },
    async set(key, value, shared){
      const store = readStore(); store[nsKey(key, shared)] = value; writeStore(store);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      const store = readStore(); const k = nsKey(key, shared);
      const existed = k in store; delete store[k]; writeStore(store);
      return {key, deleted: existed, shared: !!shared};
    },
    async list(prefix, shared){
      const store = readStore(); const pfx = nsKey(prefix || '', shared);
      const keys = Object.keys(store).filter(k => k.startsWith(pfx)).map(k => k.slice(nsKey('', shared).length));
      return {keys, prefix, shared: !!shared};
    }
  };
}

/* ===================== DONNÉES DE RÉFÉRENCE ===================== */
const DANGER_CATS = {
  "Environnement": ["Inondation","Érosion","Ravinement","Glissement de terrain","Pollution de l'eau","Pollution des sols","Déchets","Cours d'eau dangereux","Arbre dangereux","Zone exposée aux crues","Autre"],
  "Infrastructures": ["Route dégradée","Trou dans la chaussée","Pont endommagé","Bâtiment dangereux","Effondrement","Chantier dangereux","Câble électrique dangereux","Canalisation endommagée","Éclairage public défaillant","Absence de signalisation","Autre"],
  "Sécurité": ["Obstacle dangereux","Zone présentant un danger","Situation nécessitant une intervention","Autre"]
};

const GRAVITY = [

  {key:'critique', emoji:'🚨', label:'Critique', desc:"Danger immédiat, intervention urgente nécessaire.", color:'#8A2A4A'}
];
const STATUSES = ['Signalé','En vérification','Confirmé','Pris en charge','Résolu'];
const CITIES = [
  {name:'Kinshasa', lat:-4.4419, lng:15.2663},

];

  `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='100%' height='100%' fill='%231B3D32'/><text x='50%' y='50%' fill='%2393A79D' font-size='14' font-family='sans-serif' text-anchor='middle' dy='.3em'>photo</text></svg>`
);
const LINK_ICONS = {
  presse:'📰', pdf:'📄', administratif:'🏛️', etude:'🔬', video:'🎬', autre:'🔗'
};
function guessLinkIcon(url){
  const u = (url||'').toLowerCase();
  if(u.endsWith('.pdf')) return LINK_ICONS.pdf;
  if(u.includes('youtube.com')||u.includes('youtu.be')||u.includes('vimeo.com')) return LINK_ICONS.video;
  if(u.includes('.gov')||u.includes('.gouv')) return LINK_ICONS.administratif;
  return LINK_ICONS.autre;
}

/* ===================== GRADES / POINTS DE VIGILANCE ===================== */
const GRADES = [
  {min:0,   key:'inactif',    emoji:'🌑', label:'Citoyen inactif'},
  {min:10,  key:'observateur',emoji:'👀', label:'Citoyen observateur'},

];

};
function gradeForPoints(total){
  let current = GRADES[0];
  for(const g of GRADES){ if(total >= g.min) current = g; }
  const idx = GRADES.indexOf(current);
  const next = GRADES[idx+1] || null;
  return {current, next};
}

let offlineQueue = [];
let map, layerGroups = {danger:null, travaux:null};

/* ===================== UTILS ===================== */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function fmtDate(d){
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function nearestCity(lat,lng){
  let best=null,bd=Infinity;
  CITIES.forEach(c=>{const d=haversine(lat,lng,c.lat,c.lng); if(d<bd){bd=d;best=c;}});
  return best ? (bd<3 ? best.name : `près de ${best.name}`) : 'RDC';
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600);
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function normalizeUrl(u){
  u = (u||'').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function compressImage(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Compatibilité ascendante : un ancien signalement n'a que `photo` (chaîne
   unique ou null). On le convertit systématiquement en `photos` (tableau). */
function normalizeReport(r){
  if(!r.photos){
    r.photos = r.photo ? [r.photo] : [];
  }
  if(!r.links) r.links = [];
  if(!r.confirmations) r.confirmations = {oui:0,non:0,ne_sais_pas:0};
  if(!r.history) r.history = [];
  return r;
}

/* Localise précisément un signalement ou un chantier sur la carte, avec un
   halo pulsé, sans jamais recharger la page.
   thenOpen / id (optionnels) permettent de rouvrir automatiquement la fiche
   une fois la carte centrée — utilisés par le bouton 📍 rapide des cartes. */
function locateOnMap(lat, lng, thenOpen, id){
  closeAllSheets();
  showTab('carte');
  setTimeout(()=>{
    map.invalidateSize();
    map.flyTo([lat,lng], 16, {duration:0.9});
    if(locateMarker){ map.removeLayer(locateMarker); locateMarker=null; }
    const icon = L.divIcon({className:'', html:'<div class="kengela-locate-pulse"></div>', iconSize:[26,26], iconAnchor:[13,13]});
    locateMarker = L.marker([lat,lng], {icon, interactive:false, zIndexOffset:-100}).addTo(map);
    setTimeout(()=>{ if(locateMarker){ map.removeLayer(locateMarker); locateMarker=null; } }, 4000);
    if(thenOpen==='fiche') setTimeout(()=>openFiche(id), 700);
    if(thenOpen==='projet') setTimeout(()=>openProjet(id), 700);
  }, 120);
}

/* ===================== FICHE PROJET (lecture seule stricte) ===================== */
function openProjet(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;

  const obsHtml = (p.observations||[]).slice().reverse().map(o=>{
    const photosHtml = (o.photos && o.photos.length)
      ? `<div class="photos-mini">${o.photos.map(src=>`<img src="${src}" onclick="Kengela.openLightbox(${JSON.stringify(o.photos).replace(/"/g,'&quot;')}, ${o.photos.indexOf(src)})">`).join('')}</div>`
      : '';
    return `<div class="tlitem"><div class="d">${o.date}</div><div class="l">${escapeHtml(o.comment)}</div>${photosHtml}</div>`;
  }).join('') || '<div class="empty">Aucune observation pour le moment.</div>';

  document.getElementById('projetBody').innerHTML = `
    <div class="fiche-id">CHANTIER ${p.id}${p.demo?' · donnée de démonstration':''}</div>
    <div class="fiche-title">${escapeHtml(p.name)}</div>
    <div class="fiche-meta">
      <span class="badge" style="background:rgba(15,27,22,.08);color:var(--ink);">${p.type} — ${p.sub}</span>
      <span class="badge st-Signalé">${p.statut}</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${p.avancement}%"></div></div>
    <div class="proj-foot" style="margin-bottom:14px;"><span>${p.avancement}% avancé</span><span>${p.city||''}</span></div>

    <div class="reviewrow"><span>Maître d'ouvrage</span><b>${escapeHtml(p.maitre||'—')}</b></div>
    <div class="reviewrow"><span>Entreprise</span><b>${escapeHtml(p.entreprise||'—')}</b></div>
    <div class="reviewrow"><span>Début</span><b>${p.dateDebut||'—'}</b></div>
    <div class="reviewrow"><span>Fin prévue</span><b>${p.dateFin||'—'}</b></div>
    <div class="reviewrow"><span>Observations terrain</span><b>${(p.observations||[]).length}</b></div>

    <button class="locatebtn" style="margin-top:16px;" onclick="Kengela.locate(${p.lat},${p.lng})">📍 Localiser précisément sur la carte</button>
    <button class="ghostbtn" onclick="Kengela.toggleFollow('${p.id}')">${followed[p.id]?'⭐ Suivi — retirer':'☆ Suivre ce chantier'}</button>

    <h4 style="margin:22px 0 8px;font-size:12px;text-transform:uppercase;color:var(--ink-soft);">Observations terrain (contributions citoyennes)</h4>
    <div class="timeline">${obsHtml}</div>
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:16px;">Cette fiche est en consultation uniquement. Pour ajouter une nouvelle observation avec photo, utilisez le bouton ⚠️ en bas de l'écran, puis choisissez « Observer un travail ».</p>
  `;
  openSheet('sheetProjet');
}
async function toggleFollow(id){
  const wasFollowing = !!followed[id];
  followed[id] = !wasFollowing;
  await saveFollowed();
  if(!wasFollowing) await addPoints('suivi_projet');
  toast(followed[id] ? 'Chantier suivi — vous recevrez les mises à jour.' : 'Chantier retiré du suivi.');
  if(document.getElementById('sheetProjet').classList.contains('active')) openProjet(id);
}

/* ===================== LIGHTBOX (zoom photo plein écran, lecture seule) ===================== */
function openLightbox(photos, index){
  lbPhotos = Array.isArray(photos) ? photos : [photos];
  lbIndex = index || 0;
  document.getElementById('lbImg').src = lbPhotos[lbIndex];
  document.getElementById('lightbox').classList.add('active');
}
function lbShow(delta){
  lbIndex = (lbIndex + delta + lbPhotos.length) % lbPhotos.length;
  document.getElementById('lbImg').src = lbPhotos[lbIndex];
}
document.getElementById('lbClose').addEventListener('click', ()=>document.getElementById('lightbox').classList.remove('active'));
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') document.getElementById('lightbox').classList.remove('active'); });
document.getElementById('lbPrev').addEventListener('click', ()=>lbShow(-1));
document.getElementById('lbNext').addEventListener('click', ()=>lbShow(1));

/* ===================== FLUX SIGNALER (création — seul endroit avec caméra/galerie) ===================== */
function stepsForKind(kind){
  return kind==='danger'
    ? ['gps','photos','category','comment','links','gravity','review']
    : ['project','gps','photos','category','comment','links','review'];
}

function openSignalerChoice(){
  signalerMode = 'choice';
  document.getElementById('signalerHeadTitle').textContent = 'Que souhaitez-vous faire ?';
  document.getElementById('signalerProgress').innerHTML = '';
  document.getElementById('signalerBody').innerHTML = `
    <p class="step-sub">Choisissez ce que vous observez. Des photos (jusqu'à 5), votre position et un commentaire suffisent.</p>
    <button class="bigbtn" style="background:var(--g-elevee);color:#fff;margin-bottom:10px;" onclick="Kengela.beginFlow('danger')">⚠️ Signaler un danger</button>
    <button class="bigbtn" style="background:var(--river);color:#fff;" onclick="Kengela.beginFlow('travail')">🏗️ Observer un travail</button>
  `;
  openSheet('sheetSignaler');
}
function beginFlow(kind){
  signalerMode = 'flow';
  stepSequence = stepsForKind(kind);
  draft = {kind, projectId:null, group:null, category:null, gravity:null, comment:'', photos:[], links:[], lat:null, lng:null};
  step = 0;
  document.getElementById('signalerHeadTitle').textContent = kind==='danger' ? 'Signaler un danger' : 'Observer un travail';
  renderStep();
}
function signalerGoBack(){
  if(signalerMode==='choice'){ closeSheet('sheetSignaler'); return; }
  if(step===0){ openSignalerChoice(); return; }
  step--;
  renderStep();
}
document.getElementById('signalerBackBtn').addEventListener('click', signalerGoBack);

function renderProgress(){
  const n = stepSequence.length;
  let html='';
  for(let i=0;i<n;i++){ html += `<span class="${i<=step?'done':''}"></span>`; }
  document.getElementById('signalerProgress').innerHTML = html;
}

function renderStep(){
  renderProgress();
  const name = stepSequence[step];
  const body = document.getElementById('signalerBody');

  if(name==='project') return renderProjectStep(body);
  if(name==='gps') return renderGpsStep(body);
  if(name==='photos') return renderPhotosStep(body);
  if(name==='category') return renderCategoryStep(body);
  if(name==='comment') return renderCommentStep(body);
  if(name==='links') return renderLinksStep(body);
  if(name==='gravity') return renderGravityStep(body);
  if(name==='review') return renderReviewStep(body);
}

function goNext(){ step++; renderStep(); }

/* ---- étape : choix du chantier (observation de travail uniquement) ---- */
function renderProjectStep(body){
  const options = [{id:null, name:'Observation générale (hors chantier précis)', c:'Non rattachée à un projet existant'}]
    .concat(projects.map(p=>({id:p.id, name:p.name, c:`${p.city||''} · ${p.type} — ${p.sub}`})));
  body.innerHTML = `
    <div class="step-title">Quel chantier observez-vous ?</div>
    <div class="step-sub">Rattachez votre observation à un chantier existant, ou laissez-la générale.</div>
    <div id="projPickList">
      ${options.map(o=>`<div class="projpick ${draft.projectId===o.id?'sel':''}" data-id="${o.id===null?'':o.id}"><div><div class="n">${escapeHtml(o.name)}</div><div class="c">${escapeHtml(o.c)}</div></div>${draft.projectId===o.id?'✓':''}</div>`).join('')}
    </div>
    <button class="bigbtn" id="projNext" style="margin-top:10px;">Continuer</button>
  `;
  body.querySelectorAll('.projpick').forEach(el=>{
    el.addEventListener('click', ()=>{
      draft.projectId = el.dataset.id || null;
      renderStep();
    });
  });
  document.getElementById('projNext').addEventListener('click', goNext);
}

/* ---- étape : GPS ---- */
function renderGpsStep(body){
  body.innerHTML = `
    <div class="step-title">Votre position</div>
    <div class="step-sub">Kengela récupère automatiquement votre position GPS. Aucune saisie manuelle n'est nécessaire.</div>
    <div class="gpsbox" id="gpsBox">
      <div class="ic">📍</div>
      <div><div class="lat" id="gpsLat">Localisation en cours…</div><div class="lbl">Précision GPS affichée automatiquement</div></div>
    </div>
    <button class="bigbtn" id="gpsNext" disabled>Continuer</button>
  `;
  locate_();
}
function locate_(){
  if(!navigator.geolocation){
    draft.lat = userPos ? userPos.lat : CITIES[0].lat;
    draft.lng = userPos ? userPos.lng : CITIES[0].lng;
    finishLocate(true);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      draft.lat = pos.coords.latitude; draft.lng = pos.coords.longitude; draft.accuracy = pos.coords.accuracy;
      userPos = {lat:draft.lat, lng:draft.lng};
      finishLocate(false);
    },
    ()=>{
      draft.lat = CITIES[0].lat + (Math.random()-0.5)*0.02;
      draft.lng = CITIES[0].lng + (Math.random()-0.5)*0.02;
      finishLocate(true);
    },
    {enableHighAccuracy:true, timeout:8000}
  );
}
function finishLocate(fallback){
  const boxEl = document.getElementById('gpsLat');
  const next = document.getElementById('gpsNext');
  if(!boxEl) return;
  boxEl.textContent = (fallback ? '≈ ' : '') + draft.lat.toFixed(5) + ', ' + draft.lng.toFixed(5) + (draft.accuracy?` (±${Math.round(draft.accuracy)} m)`:'');
  next.disabled = false;
  next.onclick = goNext;
}

/* ---- étape : PHOTOS (zone d'ajout — création uniquement) ---- */
function renderPhotosStep(body){
  const photos = draft.photos || [];
  const full = photos.length >= MAX_PHOTOS;
  let grid = '';
  if(photos.length>0){
    grid = `<div class="photo-add-grid">${photos.map((src,i)=>`
        <div class="photo-add-slot"><img src="${src}"><button class="rm" data-i="${i}">✕</button></div>
      `).join('')}</div>
      <div class="photo-counter">${photos.length} / ${MAX_PHOTOS} photos</div>`;
  }else{
    grid = `<div class="photo-add-empty"><div class="icon">📷</div><div class="hint">Prenez une photo ou choisissez-en dans la galerie (5 maximum)</div></div>`;
  }
  body.innerHTML = `
    <div class="step-title">Ajoutez des photos</div>
    <div class="step-sub">Au moins une photo est nécessaire — vous pouvez en ajouter jusqu'à ${MAX_PHOTOS}.</div>
    ${grid}
    <div class="photo-add-buttons">
      <label class="${full?'disabled':''}">📷 Appareil photo<input type="file" accept="image/*" capture="environment" style="display:none" id="photoCam" ${full?'disabled':''}></label>
      <label class="${full?'disabled':''}">🖼️ Galerie<input type="file" accept="image/*" multiple style="display:none" id="photoGal" ${full?'disabled':''}></label>
    </div>
    <button class="bigbtn" id="photoNext" ${photos.length>0?'':'disabled'}>Continuer</button>
  `;
  body.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{ draft.photos.splice(+btn.dataset.i,1); renderStep(); });
  });
  const handlePick = async (e)=>{
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    for(const file of files){
      if(draft.photos.length >= MAX_PHOTOS){ toast(`Maximum ${MAX_PHOTOS} photos.`); break; }
      toast('Traitement de la photo…');
      const compressed = await compressImage(file, 480);
      draft.photos.push(compressed);
    }
    renderStep();
  };
  const cam = document.getElementById('photoCam'); if(cam) cam.addEventListener('change', handlePick);
  const gal = document.getElementById('photoGal'); if(gal) gal.addEventListener('change', handlePick);
  document.getElementById('photoNext').addEventListener('click', goNext);
}

/* ---- étape : catégorie ---- */
function renderCategoryStep(body){
  const cats = draft.kind==='danger' ? DANGER_CATS : TRAVAUX_TYPES;
  let html = `<div class="step-title">Catégorie</div><div class="step-sub">Choisissez ce qui décrit le mieux la situation.</div>`;
  Object.entries(cats).forEach(([group, list])=>{
    html += `<div class="catgroup"><h4>${group}</h4><div class="catgrid">`;
    list.forEach(c=>{
      const sel = (draft.group===group && draft.category===c) ? 'sel' : '';
      html += `<button class="catbtn ${sel}" data-group="${group}" data-cat="${c}">${c}</button>`;
    });
    html += `</div></div>`;
  });
  html += `<button class="bigbtn" id="catNext" ${draft.category?'':'disabled'}>Continuer</button>`;
  body.innerHTML = html;
  body.querySelectorAll('.catbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ draft.group=b.dataset.group; draft.category=b.dataset.cat; renderStep(); });
  });
  const nb = document.getElementById('catNext');
  if(nb) nb.addEventListener('click', goNext);
}

/* ---- étape : commentaire ---- */
function renderCommentStep(body){
  body.innerHTML = `
    <div class="step-title">Que voyez-vous ?</div>
    <div class="step-sub">Décrivez la situation en quelques mots.</div>
    <textarea class="commentbox" id="commentInput" placeholder="Ex. : Une partie de la route s'est effondrée. Les véhicules doivent passer sur le côté.">${draft.comment||''}</textarea>
    <button class="bigbtn" id="commentNext" style="margin-top:12px;" ${draft.comment&&draft.comment.trim()?'':'disabled'}>Continuer</button>
  `;
  const ta = document.getElementById('commentInput');
  const nb = document.getElementById('commentNext');
  ta.addEventListener('input', ()=>{ draft.comment = ta.value; nb.disabled = !ta.value.trim(); });
  nb.addEventListener('click', ()=>{ draft.comment = ta.value; goNext(); });
}

/* ---- étape : liens / sources (facultatif) ---- */
function renderLinksStep(body){
  const links = draft.links || [];
  body.innerHTML = `
    <div class="step-title">Sources et documents</div>
    <div class="step-sub">Facultatif — ajoutez un article, un rapport, une vidéo ou tout document utile.</div>
    <div class="links-list" id="linksList">
      ${links.map((l,i)=>`<div class="link-row"><span class="ic">${guessLinkIcon(l.url)}</span>
          <div class="info"><div class="lt">${escapeHtml(l.title)}</div><div class="lu">${escapeHtml(l.url)}</div></div>
          <div class="actions"><button data-edit="${i}" title="Modifier">✎</button><button data-del="${i}" title="Supprimer">✕</button></div>
        </div>`).join('')}
    </div>
    <div id="linkFormZone"></div>
    <button class="linkbtn" id="addLinkBtn">+ Ajouter un lien</button>
    <button class="bigbtn" id="linksNext" style="margin-top:14px;">Continuer</button>
  `;
  body.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{ draft.links.splice(+b.dataset.del,1); renderStep(); }));
  body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{ showLinkForm(+b.dataset.edit); }));
  document.getElementById('addLinkBtn').addEventListener('click', ()=>showLinkForm(null));
  document.getElementById('linksNext').addEventListener('click', goNext);

  function showLinkForm(editIndex){
    const existing = editIndex!==null ? draft.links[editIndex] : {title:'', url:''};
    const zone = document.getElementById('linkFormZone');
    zone.innerHTML = `
      <div class="link-form">
        <label>Titre</label>
        <input class="textinput" id="lfTitle" placeholder="Ex. Rapport de l'OVD" value="${escapeHtml(existing.title)}">
        <label>URL</label>
        <input class="textinput" id="lfUrl" placeholder="https://..." value="${escapeHtml(existing.url)}">
        <div class="rowbtns">
          <button class="ghostbtn" id="lfCancel" style="margin-top:0;">Annuler</button>
          <button class="bigbtn" id="lfSave" style="margin-top:0;">Enregistrer</button>
        </div>
      </div>`;
    document.getElementById('lfCancel').addEventListener('click', ()=>{ zone.innerHTML=''; });
    document.getElementById('lfSave').addEventListener('click', ()=>{
      const title = document.getElementById('lfTitle').value.trim() || 'Source';
      const url = document.getElementById('lfUrl').value.trim();
      if(!url){ toast('Merci de renseigner une URL.'); return; }
      const entry = {title, url: normalizeUrl(url)};
      if(editIndex!==null) draft.links[editIndex] = entry; else draft.links.push(entry);
      renderStep();
    });
  }
}

/* ---- étape : gravité (danger uniquement) ---- */
function renderGravityStep(body){
  body.innerHTML = `
    <div class="step-title">Niveau de gravité</div>
    <div class="step-sub">Aide-nous à prioriser l'intervention.</div>
    <div class="gravrow">
      ${GRAVITY.map(g=>`<div class="gravopt ${draft.gravity===g.key?'sel':''}" data-g="${g.key}">
          <div class="e">${g.emoji}</div><div><div class="t">${g.label}</div><div class="d">${g.desc}</div></div>
        </div>`).join('')}
    </div>
    <button class="bigbtn" id="gravNext" style="margin-top:14px;" ${draft.gravity?'':'disabled'}>Continuer</button>
  `;
  body.querySelectorAll('.gravopt').forEach(el=>el.addEventListener('click', ()=>{ draft.gravity = el.dataset.g; renderStep(); }));
  const nb = document.getElementById('gravNext');
  if(nb) nb.addEventListener('click', goNext);
}

/* ---- étape finale : récapitulatif ---- */
function renderReviewStep(body){
  const g = GRAVITY.find(x=>x.key===draft.gravity);
  const project = draft.projectId ? projects.find(p=>p.id===draft.projectId) : null;
  body.innerHTML = `
    <div class="step-title">Vérifiez avant l'envoi</div>
    ${draft.photos.length ? `<div class="photo-add-grid" style="margin-top:10px;">${draft.photos.map(src=>`<div class="photo-add-slot"><img src="${src}"></div>`).join('')}</div>` : ''}
    <div class="reviewrow"><span>Catégorie</span><b>${escapeHtml(draft.category)}</b></div>
    ${draft.kind==='danger' ? `<div class="reviewrow"><span>Gravité</span><b>${g.emoji} ${g.label}</b></div>` : ''}
    ${project ? `<div class="reviewrow"><span>Chantier</span><b>${escapeHtml(project.name)}</b></div>` : ''}
    <div class="reviewrow"><span>Photos</span><b>${draft.photos.length} / ${MAX_PHOTOS}</b></div>
    <div class="reviewrow"><span>Sources</span><b>${(draft.links||[]).length}</b></div>
    <div class="reviewrow"><span>Position</span><b>${draft.lat?draft.lat.toFixed(4)+', '+draft.lng.toFixed(4):'—'}</b></div>
    <div class="reviewrow" style="border-bottom:none;flex-direction:column;align-items:flex-start;gap:4px;"><span>Commentaire</span><b style="font-weight:500;">${escapeHtml(draft.comment)}</b></div>
    <button class="bigbtn" style="margin-top:16px;" id="sendBtn">Envoyer</button>
  `;
  document.getElementById('sendBtn').addEventListener('click', submitDraft);
}

/* ---- envoi ---- */
async function submitDraft(){
  if(!navigator.onLine){
    offlineQueue.push({...draft});
    toast(`${offlineQueue.length} observation(s) en attente de synchronisation.`);
    closeSheet('sheetSignaler');
    return;
  }

  if(draft.kind==='danger'){
    const r = normalizeReport({
      id: uid('KEN'), kind:'danger',
      group:draft.group, category:draft.category, gravity:draft.gravity,
      comment:draft.comment, photos:draft.photos, links:draft.links,
      lat:draft.lat, lng:draft.lng, date:new Date().toISOString(), status:'Signalé',
      confirmations:{oui:0,non:0,ne_sais_pas:0},
      history:[{date:new Date().toISOString().slice(0,10), label:'Signalement citoyen.'}],
      mine:true
    });
    await saveReport(r);
    await markAsMine(r.id);
    await addPoints('danger_signale');
    if((draft.links||[]).length) for(let i=0;i<draft.links.length;i++) await addPoints('lien_ajoute');
    renderFeed(); renderMap(); renderActualites();
    closeSheet('sheetSignaler');
    toast(`Signalement envoyé. +${POINTS_RULES.danger_signale.pts} points de vigilance.`);
    locateOnMap(r.lat, r.lng);
  } else {
    const project = draft.projectId ? projects.find(p=>p.id===draft.projectId) : null;
    const obs = {date:new Date().toISOString().slice(0,10), comment:draft.comment, photos:draft.photos};
    if(project){
      project.observations = project.observations || [];
      project.observations.push(obs);
      await saveProject(project);
      await addPoints('travail_observe');
      renderActualites();
      closeSheet('sheetSignaler');
      toast(`Observation envoyée. +${POINTS_RULES.travail_observe.pts} points de vigilance.`);
      locateOnMap(project.lat, project.lng);
    } else {
      const r = normalizeReport({
        id: uid('OBS'), kind:'travail',
        group:draft.group, category:draft.category, gravity:null,
        comment:draft.comment, photos:draft.photos, links:draft.links,
        lat:draft.lat, lng:draft.lng, date:new Date().toISOString(), status:'Signalé',
        confirmations:{oui:0,non:0,ne_sais_pas:0},
        history:[{date:new Date().toISOString().slice(0,10), label:'Observation citoyenne d\u2019un chantier.'}],
        mine:true
      });
      await saveReport(r);
      await markAsMine(r.id);
      await addPoints('travail_observe');
      renderFeed(); renderMap(); renderActualites();
      closeSheet('sheetSignaler');
      toast(`Observation envoyée. +${POINTS_RULES.travail_observe.pts} points de vigilance.`);
      locateOnMap(r.lat, r.lng);
    }
  }
}

/* ===================== AUTOUR DE MOI ===================== */
let radiusKm = 5;
function renderRadiusRow(){
  const row = document.getElementById('radiusRow');
  row.innerHTML = [1,5,10,25].map(r=>`<div class="rchip ${r===radiusKm?'active':''}" data-r="${r}">${r} km</div>`).join('');
  row.querySelectorAll('.rchip').forEach(c=>c.addEventListener('click', ()=>{ radiusKm=+c.dataset.r; renderAround(); }));
}
function renderAround(){
  renderRadiusRow();
  const summary = document.getElementById('aroundSummary');
  const feed = document.getElementById('aroundFeed');
  if(!userPos){
    summary.innerHTML = '';
    feed.innerHTML = `<div class="empty">Activation de la localisation…<br>Autorisez l'accès pour voir ce qui se passe autour de vous.</div>`;
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{ userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude}; renderAround(); },
        ()=>{ userPos = {lat:CITIES[0].lat, lng:CITIES[0].lng}; renderAround(); });
    }
    return;
  }
  const nearDangers = reports.filter(r=>haversine(userPos.lat,userPos.lng,r.lat,r.lng)<=radiusKm);
  const nearTravaux = projects.filter(p=>haversine(userPos.lat,userPos.lng,p.lat,p.lng)<=radiusKm);
  summary.innerHTML = `
    <div class="box"><div class="n">${nearDangers.length}</div><div class="l">Signalements</div></div>
    <div class="box"><div class="n">${nearTravaux.length}</div><div class="l">Chantiers</div></div>
    <div class="box"><div class="n">${nearDangers.length+nearTravaux.length}</div><div class="l">Total</div></div>
  `;
  const items = [
    ...nearDangers.map(r=>({dist:haversine(userPos.lat,userPos.lng,r.lat,r.lng), html:reportCard(r)})),
    ...nearTravaux.map(p=>({dist:haversine(userPos.lat,userPos.lng,p.lat,p.lng), html:projCard(p)}))
  ].sort((a,b)=>a.dist-b.dist);
  feed.innerHTML = items.length ? items.map(i=>i.html).join('') : `<div class="empty">Rien signalé dans un rayon de ${radiusKm} km.</div>`;
}

/* ===================== PROFIL / POINTS DE VIGILANCE ===================== */
function openProfil(){
  const mine = reports.filter(r=>r.mine).length;
  const followedCount = Object.values(followed).filter(Boolean).length;
  const {current, next} = gradeForPoints(myPoints.total);
  const span = next ? (next.min - current.min) : 1;
  const progress = next ? Math.min(100, Math.round(((myPoints.total - current.min) / span) * 100)) : 100;

  document.getElementById('profilBody').innerHTML = `
    <div class="grade-card">
      <div class="top">
        <div class="emoji">${current.emoji}</div>
        <div><div class="name">${current.label}</div><div class="pts">${myPoints.total} points de vigilance</div></div>
      </div>
      <div class="grade-bar-track"><div class="grade-bar-fill" style="width:${progress}%"></div></div>
      <div class="grade-next">${next ? `${next.min - myPoints.total} points avant « ${next.label} » ${next.emoji}` : 'Grade maximum atteint — merci pour votre engagement !'}</div>
    </div>
    <div class="around-summary" style="padding:0 0 18px;">
      <div class="box" style="background:rgba(15,27,22,.05);"><div class="n" style="color:var(--ink);">${mine}</div><div class="l">Mes signalements</div></div>
      <div class="box" style="background:rgba(15,27,22,.05);"><div class="n" style="color:var(--ink);">${followedCount}</div><div class="l">Chantiers suivis</div></div>
      <div class="box" style="background:rgba(15,27,22,.05);"><div class="n" style="color:var(--ink);">${reports.length}</div><div class="l">Total plateforme</div></div>
    </div>
    <h4 style="font-size:12px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px;">Derniers points gagnés</h4>
    <div class="points-log">
      ${myPoints.log.slice(0,8).map(l=>`<div class="points-log-row"><span class="pl">${escapeHtml(l.label)}</span><span class="pv">+${l.pts}</span></div>`).join('') || '<div class="empty">Contribuez pour gagner vos premiers points.</div>'}
    </div>
    <h4 style="font-size:12px;text-transform:uppercase;color:var(--ink-soft);margin:20px 0 10px;">Mes signalements</h4>
    <div style="margin:0 -18px;">
      ${reports.filter(r=>r.mine).length ? reports.filter(r=>r.mine).map(reportCard).join('') : '<div class="empty">Vous n\u2019avez pas encore contribué. Touchez ⚠️ pour signaler votre premier danger.</div>'}
    </div>
    <div style="height:8px;"></div>
    <button class="ghostbtn" data-close>Fermer</button>
  `;
  document.querySelectorAll('#sheetProfil [data-close]').forEach(b=>b.addEventListener('click', ()=>closeSheet('sheetProfil')));
  openSheet('sheetProfil');
}

/* ===================== NAVIGATION ===================== */
function showTab(tab){
  if(tab==='profil-nav'){ openProfil(); return; }
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='autour') renderAround();
  if(tab==='actualites') renderActualites();
  if(tab==='carte') setTimeout(()=>map && map.invalidateSize(), 50);
}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click', ()=>showTab(b.dataset.tab)));
document.getElementById('btnSignaler').addEventListener('click', openSignalerChoice);
document.getElementById('btnProfil').addEventListener('click', openProfil);

document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>closeAllSheets()));
document.querySelectorAll('.sheet-overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{ if(e.target===ov) closeAllSheets(); });
});
document.querySelectorAll('.sheet').forEach(sheet=>{
  let startY=null, currentY=0, dragging=false;
  const handle = sheet.querySelector('.drag-handle') || sheet;
  handle.addEventListener('touchstart', e=>{ startY = e.touches[0].clientY; dragging=true; sheet.style.transition='none'; }, {passive:true});
  handle.addEventListener('touchmove', e=>{
    if(!dragging) return;
    currentY = Math.max(0, e.touches[0].clientY - startY);
    sheet.style.transform = `translateY(${currentY}px)`;
  }, {passive:true});
  handle.addEventListener('touchend', ()=>{
    dragging=false; sheet.style.transition='';
    if(currentY > 110){ closeAllSheets(); }
    sheet.style.transform=''; currentY=0;
  });
});

/* ===================== RECHERCHE ===================== */
const searchInput = document.getElementById('searchInput');
const searchbarEl = document.getElementById('searchbar');
searchInput.addEventListener('input', ()=>{
  searchQuery = searchInput.value.trim().toLowerCase();
  searchbarEl.classList.toggle('has-text', searchQuery.length>0);
  renderFeed();
});
document.getElementById('searchClear').addEventListener('click', ()=>{
  searchInput.value=''; searchQuery=''; searchbarEl.classList.remove('has-text'); renderFeed();
});

/* ===================== RÉSEAU (mode hors connexion) ===================== */
function updateNetStatus(){
  const pill = document.getElementById('netPill');
  const lbl = document.getElementById('netLbl');
  if(navigator.onLine){ pill.classList.remove('off'); lbl.textContent = 'En ligne'; flushOfflineQueue(); }
  else{ pill.classList.add('off'); lbl.textContent = 'Hors connexion'; }
}
async function flushOfflineQueue(){
  if(offlineQueue.length===0) return;
  toast(`Synchronisation de ${offlineQueue.length} observation(s)…`);
  const q = offlineQueue; offlineQueue = [];
  for(const d of q){ draft = d; await submitDraft(); }
}
window.addEventListener('online', updateNetStatus);
window.addEventListener('offline', updateNetStatus);

/* ===================== API GLOBALE (utilisée par les attributs onclick) ===================== */
window.Kengela = {
  openFiche, openProjet, toggleFollow, confirm:confirmReport,
  beginFlow, closeSheet, closeAllSheets,
  locate: locateOnMap,
  openLightbox, viewPhotoSwap
};

/* ===================== INIT ===================== */
(async function init(){
  const splash = document.getElementById('splash');
  const splashMsg = document.getElementById('splashMsg');
  const minSplashDuration = new Promise(r=>setTimeout(r, 900));
  const hardTimeout = setTimeout(()=>{
    splash.classList.add('hidden');
    setTimeout(()=>{ splash.style.display='none'; map && map.invalidateSize(); }, 550);
  }, 6000);

  try{
    initMap();
    updateNetStatus();
    await loadAll();
    if(splashMsg) splashMsg.textContent = 'Mise en place de la carte…';
    renderFeed();
    renderActualites();
    renderMap();
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{ userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude}; }, ()=>{});
    }
  }catch(err){
    console.error('Kengela — erreur au démarrage :', err);
    toast("Un problème est survenu au chargement. L'application continue en mode dégradé.");
  }finally{
    clearTimeout(hardTimeout);
    await minSplashDuration;
    splash.classList.add('hidden');
    setTimeout(()=>{ splash.style.display='none'; map && map.invalidateSize(); }, 550);
  }
})();

})();
</script>
</body>
